# ==============================================================================
# 🪙 Kono.ai — Mono-Docker All-in-One Compose (Hot-Reload Enabled)
# Runs Redis + Rust Core + Python FastAPI + React/Nginx on port 80 (Zero n8n)
# ==============================================================================

services:
  kono-app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    container_name: kono-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Live Hot-Reload Mounts for Python Backend
      - ./backend/python-api/app:/app/app
      # Persistent Data Storage
      - kono_storage:/data/storage
    environment:
      - ENVIRONMENT=development
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KONO_WEBHOOK_SECRET=${KONO_WEBHOOK_SECRET:-kono_secret_key_2026}
      - SUPABASE_URL=${SUPABASE_URL:-https://avkxhplapmibhyleywzd.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-}

volumes:
  kono_storage:
    driver: local
