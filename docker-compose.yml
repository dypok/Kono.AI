# ==============================================================================
# 🪙 Kono.ai — Unified Docker Compose (Development Hot-Reload by Default)
# Architecture: Rust Ingestion Core + Python FastAPI Engine + Redis + React App
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. In-Memory Event Broker & Job Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kono-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kono-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. 🦀 Rust Ingestion Core (Folder Watcher & PDF/Image Triage)
  # ----------------------------------------------------------------------------
  rust-core:
    build:
      context: ./backend/rust-core
      dockerfile: Dockerfile
    container_name: kono-rust-core
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379/0
      - WATCH_DIR=/data/storage/inbound
      - STORAGE_DIR=/data/storage
    volumes:
      - shared_storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kono-network

  # ----------------------------------------------------------------------------
  # 3. 🐍 Python API & Business Engine (FastAPI with --reload Hot-Reload)
  # ----------------------------------------------------------------------------
  python-api:
    build:
      context: ./backend/python-api
      dockerfile: Dockerfile
    container_name: kono-python-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////data/storage/kono.db
      - STORAGE_DIR=/data/storage
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-kono_secret_n8n_key_2026}
      - MAX_INBOUND_BYTES=${MAX_INBOUND_BYTES:-15728640}
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - IMAP_POLL_INTERVAL_SEC=${IMAP_POLL_INTERVAL_SEC:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/python-api/app:/app/app
      - shared_storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kono-network

  # ----------------------------------------------------------------------------
  # 4. ⚛️ Frontend Split-Screen Dashboard (Vite HMR Live Reload)
  # ----------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: kono-frontend
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - python-api
    networks:
      - kono-network

  # ----------------------------------------------------------------------------
  # 5. 🤖 n8n Workflow Automation Platform (Inbound & ERP Orchestration)
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: kono-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - shared_storage:/data/storage
    depends_on:
      - python-api
    networks:
      - kono-network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  shared_storage:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

networks:
  kono-network:
    driver: bridge
