# ==============================================================================
# 🪙 Kono.ai — Development Docker Compose (Hot-Reloading Enabled)
# Changes in Python, React, or Rust trigger instant reloads without rebuilds
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. In-Memory Event Broker & Job Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kono-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kono-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. 🦀 Rust Ingestion Core (Development Mode)
  # ----------------------------------------------------------------------------
  rust-core:
    build:
      context: ./backend/rust-core
      dockerfile: Dockerfile
    container_name: kono-rust-core
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379/0
      - WATCH_DIR=/data/storage/inbound
      - STORAGE_DIR=/data/storage
    volumes:
      - shared_storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kono-network

  # ----------------------------------------------------------------------------
  # 3. 🐍 Python API & Business Engine (FastAPI with --reload Hot-Reload)
  # ----------------------------------------------------------------------------
  python-api:
    build:
      context: ./backend/python-api
      dockerfile: Dockerfile
    container_name: kono-python-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////data/storage/kono.db
      - STORAGE_DIR=/data/storage
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-kono_secret}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/python-api/app:/app/app:ro
      - shared_storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kono-network

  # ----------------------------------------------------------------------------
  # 4. ⚛️ Frontend Split-Screen Dashboard (Vite HMR Dev Server)
  # ----------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: kono-frontend-dev
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - python-api
    networks:
      - kono-network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  shared_storage:
    driver: local
  redis_data:
    driver: local

networks:
  kono-network:
    driver: bridge
